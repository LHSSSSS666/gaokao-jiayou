<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>高考加油 | 粒子祝福系统</title>
<style>
:root {
  --bg: #0a0a14; --panel-bg: rgba(14,14,28,0.85); --text: #e0e0e0; --text-dim: #888;
  --accent: #ff5588; --accent2: #66aaff; --border: rgba(255,255,255,0.08);
  --radius: 12px; --shadow: 0 8px 32px rgba(0,0,0,0.5);
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg); overflow: hidden;
  font-family: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  user-select: none; -webkit-user-select: none;
  height: 100vh; width: 100vw; color: var(--text);
}
#canvas-container { position: fixed; inset:0; z-index:1; }
#canvas-container canvas { display:block; }

#sidebar {
  position: fixed; right:0; top:0; bottom:0; z-index:10;
  width: 260px; background: var(--panel-bg);
  backdrop-filter: blur(20px) saturate(140%);
  -webkit-backdrop-filter: blur(20px) saturate(140%);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 16px 14px; gap: 10px;
  transition: transform 0.35s cubic-bezier(0.4,0,0.2,1);
  overflow-y: auto;
}
#sidebar.collapsed { transform: translateX(100%); }

#sidebar-toggle {
  position: fixed; right:260px; top:50%; z-index:11;
  transform: translateY(-50%);
  width: 22px; height: 56px;
  background: var(--panel-bg); backdrop-filter: blur(20px);
  border: 1px solid var(--border); border-right: none;
  border-radius: 8px 0 0 8px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: var(--text-dim);
  transition: all 0.35s cubic-bezier(0.4,0,0.2,1), right 0.35s;
}
#sidebar-toggle.shifted { right:0; }
#sidebar-toggle:hover { color: #fff; background: rgba(30,30,50,0.95); }

.section-title {
  font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
  color: var(--text-dim); margin: 4px 0 2px; padding-left: 2px;
}

.preset-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; }
.preset-btn {
  padding: 10px 8px; border-radius: 8px; border: 1px solid var(--border);
  background: rgba(255,255,255,0.03); color: var(--text); cursor: pointer;
  font-size: 12px; font-family: inherit; transition: all 0.2s;
  text-align: center; white-space: nowrap;
}
.preset-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.2); transform: translateY(-1px); }
.preset-btn:active { transform: scale(0.96); }
.preset-btn.active { border-color: var(--accent); background: rgba(255,85,136,0.15); box-shadow: 0 0 16px rgba(255,85,136,0.2); color: #fff; }
.preset-btn .icon { font-size: 18px; display: block; margin-bottom: 2px; }

.color-row { display: flex; align-items: center; gap: 8px; }
#color-picker {
  -webkit-appearance: none; appearance: none;
  width: 36px; height: 36px; border-radius: 50%;
  border: 2px solid var(--border); cursor: pointer; background: transparent; padding: 0;
}
#color-picker::-webkit-color-swatch-wrapper { padding: 0; }
#color-picker::-webkit-color-swatch { border-radius: 50%; border: none; }
#hex-input {
  flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border);
  border-radius: 6px; padding: 6px 8px; color: var(--text);
  font-size: 12px; font-family: monospace; outline: none;
}
#hex-input:focus { border-color: var(--accent); }

.color-presets { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.color-preset {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer; transition: all 0.2s;
}
.color-preset:hover { transform: scale(1.2); border-color: #fff; }

.slider-group { display: flex; flex-direction: column; gap: 2px; }
.slider-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); }
.slider-label span:last-child { color: var(--text); }
input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 4px; border-radius: 2px;
  background: rgba(255,255,255,0.1); outline: none;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent); cursor: pointer;
  box-shadow: 0 0 8px rgba(255,85,136,0.5);
}

.action-row { display: flex; gap: 6px; }
.action-btn {
  flex:1; padding: 8px; border-radius: 8px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.04);
  color: var(--text); cursor: pointer;
  font-size: 11px; font-family: inherit; transition: all 0.2s;
}
.action-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.25); }
.action-btn.accent { border-color: var(--accent2); color: var(--accent2); }
.action-btn.accent:hover { background: rgba(102,170,255,0.15); }

#camera-pip {
  position: fixed; bottom: 20px; left: 20px; z-index: 10;
  width: 200px; height: 150px; border-radius: 12px; overflow: hidden;
  border: 2px solid rgba(255,255,255,0.15);
  box-shadow: 0 4px 24px rgba(0,0,0,0.5); background: #000;
  cursor: grab; min-width: 120px; min-height: 90px; max-width: 400px; max-height: 300px;
}
#camera-pip:hover { border-color: rgba(255,255,255,0.35); }
#camera-pip.resizing { border-color: var(--accent); cursor: nwse-resize; }
#camera-pip video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); pointer-events: none; }
#camera-pip .pip-label {
  position: absolute; top: 6px; left: 8px;
  font-size: 10px; color: rgba(255,255,255,0.7); pointer-events: none;
  text-shadow: 0 0 6px rgba(0,0,0,0.8);
}
#pip-resize-handle {
  position: absolute; bottom: 2px; right: 2px;
  width: 18px; height: 18px; cursor: nwse-resize; opacity: 0.5; transition: opacity 0.2s;
}
#pip-resize-handle:hover { opacity: 1; }
#pip-resize-handle::after { content: '\25E2'; display: block; font-size: 14px; color: rgba(255,255,255,0.7); line-height: 1; }

#status-bar {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 10;
  display: flex; gap: 12px; pointer-events: none;
}
.status-pill {
  padding: 6px 14px; border-radius: 20px;
  background: rgba(14,14,28,0.8); backdrop-filter: blur(12px);
  border: 1px solid var(--border);
  font-size: 11px; color: var(--text-dim);
  display: flex; align-items: center; gap: 6px;
}
.status-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: #44ff44; }
.status-pill .dot.warn { background: #ffaa00; }
.status-pill .dot.off { background: #ff4444; }

#fullscreen-btn {
  position: fixed; bottom: 24px; right: 280px; z-index: 10;
  width: 40px; height: 40px; border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.15);
  background: rgba(14,14,28,0.7); backdrop-filter: blur(12px);
  color: #fff; cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center; transition: all 0.3s;
}
#fullscreen-btn.shifted { right: 20px; }
#fullscreen-btn:hover { background: rgba(30,30,50,0.9); border-color: rgba(255,255,255,0.4); }

#permission-overlay {
  position: fixed; inset:0; z-index:100;
  background: rgba(0,0,0,0.92); backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 20px; transition: opacity 0.5s;
}
#permission-overlay.hidden { opacity:0; pointer-events:none; }
#permission-overlay h2 { font-size: 26px; font-weight: 500; color: #fff; }
#permission-overlay p { color: var(--text-dim); font-size: 14px; text-align: center; max-width: 300px; line-height: 1.6; }
#permission-btn {
  padding: 14px 48px; border-radius: 30px; border: none;
  background: linear-gradient(135deg, #ff5588, #ff8844); color: #fff; cursor: pointer;
  font-size: 16px; font-family: inherit; transition: all 0.2s;
  animation: pulse 2s infinite;
}
#permission-btn:hover { transform: scale(1.05); box-shadow: 0 4px 24px rgba(255,85,136,0.5); }
@keyframes pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,85,136,0.4)} 50%{box-shadow:0 0 0 12px rgba(255,85,136,0)} }

#perf-notice {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 20;
  padding: 8px 20px; border-radius: 20px;
  background: rgba(255,170,0,0.2); border: 1px solid rgba(255,170,0,0.4);
  font-size: 11px; color: #ffaa00; pointer-events: none;
  opacity: 0; transition: opacity 0.5s;
}
#perf-notice.show { opacity: 1; }

::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 2px; }

@media (max-width: 600px) {
  #sidebar { width: 100%; height: 55%; top: auto; bottom: 0; border-left: none; border-top: 1px solid var(--border); border-radius: 16px 16px 0 0; transform: translateY(100%); }
  #sidebar:not(.collapsed) { transform: translateY(0); }
  #sidebar-toggle { right: 50%; top: auto; bottom: 12px; transform: translateX(50%); width: 60px; height: 22px; border-radius: 12px 12px 0 0; border: 1px solid var(--border); border-bottom: none; }
  #sidebar-toggle.shifted { right: 50%; transform: translateX(50%); }
  #fullscreen-btn { display: none; }
  #camera-pip { display: none; }
}
</style>
</head>
<body>

<div id="canvas-container"></div>

<div id="permission-overlay">
  <h2>高考加油</h2>
  <p>粒子祝福系统<br>点击下方按钮开始</p>
  <button id="permission-btn">点击开始</button>
</div>

<div id="status-bar">
  <div class="status-pill" id="fps-pill"><span class="dot"></span> FPS <span id="fps-value">--</span></div>
  <div class="status-pill" id="hand-pill"><span class="dot off"></span> 手势: <span id="gesture-indicator">未检测</span></div>
</div>

<div id="sidebar-toggle" title="折叠面板">&#9664;</div>
<div id="sidebar">
  <div class="section-title">预设模型</div>
  <div class="preset-grid" id="preset-grid">
    <button class="preset-btn" data-preset="dualsphere"><span class="icon">&#128302;</span>双球</button>
    <button class="preset-btn" data-preset="nebula"><span class="icon">&#127756;</span>星云</button>
    <button class="preset-btn" data-preset="fireworks"><span class="icon">&#127878;</span>烟花</button>
    <button class="preset-btn" data-preset="saturn"><span class="icon">&#129680;</span>土星</button>
    <button class="preset-btn" data-preset="flower"><span class="icon">&#127800;</span>花朵</button>
    <button class="preset-btn" data-preset="vortex"><span class="icon">&#127744;</span>漩涡</button>
    <button class="preset-btn" data-preset="heart"><span class="icon">&#128150;</span>心形</button>
    <button class="preset-btn active" data-preset="gaoshuo"><span class="icon">&#10024;</span>祝福</button>
  </div>

  <div class="section-title">文字内容</div>
  <div style="display:flex;flex-direction:column;gap:4px;">
    <div style="display:flex;align-items:center;gap:4px;">
      <span style="font-size:10px;color:var(--text-dim);width:48px;">显示文字:</span>
      <input type="text" class="color-row" id="bless-input" value="李明 高考加油!" maxlength="8" placeholder="输入文字" style="flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:6px;padding:5px 6px;color:var(--text);font-size:12px;font-family:inherit;outline:none;min-width:0;">
    </div>
    <div class="action-row">
      <button class="action-btn accent" id="text-apply-btn">应用文字</button>
    </div>
  </div>

  <div class="section-title">音乐设置</div>
  <div style="display:flex;flex-direction:column;gap:4px;">
    <div style="display:flex;align-items:center;gap:4px;">
      <span style="font-size:10px;color:var(--text-dim);width:36px;">主音</span>
      <input type="file" id="music-file-main" accept="audio/*" style="display:none;">
      <button class="action-btn" id="music-btn-main" style="font-size:10px;padding:4px 6px;flex:1;">选择文件</button>
      <span id="music-name-main" style="font-size:9px;color:var(--text-dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">未选择</span>
    </div>
    <div class="slider-group" style="margin-bottom:2px;">
      <div class="slider-label"><span>主音量</span><span id="vol-main-val">1.0</span></div>
      <input type="range" id="vol-main-slider" min="0" max="1" value="1" step="0.05">
    </div>
    <div style="display:flex;align-items:center;gap:4px;">
      <span style="font-size:10px;color:var(--text-dim);width:36px;">伴音</span>
      <input type="file" id="music-file-bg" accept="audio/*" style="display:none;">
      <button class="action-btn" id="music-btn-bg" style="font-size:10px;padding:4px 6px;flex:1;">选择文件</button>
      <span id="music-name-bg" style="font-size:9px;color:var(--text-dim);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">未选择</span>
    </div>
    <div class="slider-group">
      <div class="slider-label"><span>伴音量</span><span id="vol-bg-val">0.3</span></div>
      <input type="range" id="vol-bg-slider" min="0" max="1" value="0.3" step="0.05">
    </div>
  </div>

  <div class="section-title">颜色</div>
  <div class="color-row">
    <input type="color" id="color-picker" value="#ff5588">
    <input type="text" id="hex-input" value="#ff5588" maxlength="7">
  </div>
  <div class="color-presets" id="color-presets"></div>
  <div class="action-row" style="margin-top:2px">
    <button class="action-btn" id="fixed-color-toggle" style="font-size:11px">色相流动(开)</button>
  </div>

  <div class="section-title">粒子密度</div>
  <div class="slider-group">
    <div class="slider-label"><span>粒子数量</span><span id="density-val">8000</span></div>
    <input type="range" id="density-slider" min="1000" max="20000" value="8000" step="500">
  </div>

  <div class="section-title">扩散程度</div>
  <div class="slider-group">
    <div class="slider-label"><span>扩散</span><span id="spread-val">0.50</span></div>
    <input type="range" id="spread-slider" min="0.1" max="1.5" value="0.5" step="0.01">
  </div>

  <div class="section-title">粒子大小</div>
  <div class="slider-group">
    <div class="slider-label"><span>大小</span><span id="size-val">1.00</span></div>
    <input type="range" id="size-slider" min="0.2" max="3" value="1" step="0.01">
  </div>

  <div class="section-title">旋转速度</div>
  <div class="slider-group">
    <div class="slider-label"><span>速度</span><span id="speed-val">0.50</span></div>
    <input type="range" id="speed-slider" min="0" max="2" value="0.5" step="0.01">
  </div>

  <div class="action-row" style="margin-top:6px">
    <button class="action-btn" id="reset-btn">重置</button>
    <button class="action-btn accent" id="perf-toggle">性能模式</button>
  </div>
</div>

<div id="camera-pip">
  <span class="pip-label">摄像头</span>
  <video id="pip-video" autoplay playsinline></video>
  <div id="pip-resize-handle"></div>
</div>

<button id="fullscreen-btn" title="全屏">&#9954;</button>
<div id="perf-notice">性能模式已激活 — 粒子数已降低</div>

<audio id="bgm-audio" preload="auto" loop><source src="zhangxuefeng.mp3"></audio>
<audio id="bgm-bg" preload="auto" loop><source src="yilushenghua.mp3"></audio>
<div id="music-toast" style="position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:20;padding:8px 20px;border-radius:20px;background:rgba(255,102,68,0.2);border:1px solid rgba(255,170,68,0.4);font-size:12px;color:#ffaa44;pointer-events:none;opacity:0;transition:opacity 0.5s;">张雪峰老师祝福你 播放中</div>

<script src="three.min.js"></script>

<script>
// ==========================================
//  985 & 211 UNIVERSITIES
// ==========================================
const UNIVERSITIES = [
  '北京大学','清华大学','复旦大学','上海交通大学','浙江大学',
  '中国科学技术大学','南京大学','西安交通大学','哈尔滨工业大学',
  '武汉大学','华中科技大学','中山大学','南开大学','天津大学',
  '同济大学','东南大学','北京师范大学','中国人民大学','北京航空航天大学',
  '北京理工大学','中国农业大学','中央民族大学','大连理工大学','东北大学',
  '吉林大学','华东师范大学','山东大学','中国海洋大学','湖南大学',
  '中南大学','国防科技大学','华南理工大学','四川大学','电子科技大学',
  '重庆大学','西北工业大学','兰州大学','西北农林科技大学','厦门大学',
  '北京交通大学','北京工业大学','北京科技大学','北京化工大学','北京邮电大学',
  '北京林业大学','北京协和医学院','北京中医药大学','北京外国语大学','中国传媒大学',
  '中央财经大学','对外经济贸易大学','北京体育大学','中央音乐学院','中国政法大学',
  '华北电力大学','中国矿业大学(北京)','中国石油大学(北京)','中国地质大学(北京)',
  '上海财经大学','上海大学','上海外国语大学','华东理工大学','东华大学',
  '苏州大学','南京航空航天大学','南京理工大学','中国矿业大学','河海大学',
  '江南大学','南京农业大学','中国药科大学','南京师范大学',
  '安徽大学','合肥工业大学','福州大学','南昌大学','中国石油大学(华东)',
  '郑州大学','华中农业大学','华中师范大学','中南财经政法大学','武汉理工大学',
  '中国地质大学(武汉)','湖南师范大学','暨南大学','华南师范大学',
  '广西大学','海南大学','西南交通大学','西南大学','西南财经大学',
  '四川农业大学','贵州大学','云南大学','西藏大学','西北大学',
  '西安电子科技大学','长安大学','陕西师范大学','青海大学','宁夏大学',
  '新疆大学','石河子大学','内蒙古大学','辽宁大学','大连海事大学',
  '延边大学','东北师范大学','哈尔滨工程大学','东北农业大学','东北林业大学',
];

// ==========================================
//  CONFIGURATION
// ==========================================
const CONFIG = {
  particleDensity: 8000,
  baseColor: '#ff5588',
  spread: 0.5,
  particleSize: 1.0,
  rotationSpeed: 0.5,
  currentPreset: 'gaoshuo',
  performanceMode: false,
  bgStarCount: 2000,
  fixedColor: false,
  blessingText: '李明 高考加油!',
};

// ==========================================
//  THREE.JS SCENE SETUP
// ==========================================
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, container.clientWidth/container.clientHeight, 0.1, 100);
camera.position.set(0, 0.2, 8);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setClearColor(0x0a0a14);
container.appendChild(renderer.domElement);

// ==========================================
//  GLOW TEXTURE
// ==========================================
function createGlowTexture(innerColor, outerColor, size) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  gradient.addColorStop(0,innerColor); gradient.addColorStop(0.15,innerColor);
  gradient.addColorStop(0.5,outerColor); gradient.addColorStop(1,'transparent');
  ctx.fillStyle=gradient; ctx.fillRect(0,0,size,size);
  return new THREE.CanvasTexture(canvas);
}
const glowTexCore = createGlowTexture('rgba(255,255,255,1)','rgba(255,255,255,0.3)',128);
const glowTexMid  = createGlowTexture('rgba(255,255,255,0.8)','rgba(255,255,255,0.1)',128);
const glowTexSoft = createGlowTexture('rgba(255,255,255,0.4)','rgba(255,255,255,0.02)',128);

// ==========================================
//  PARTICLE SYSTEM
// ==========================================
const mainGroup = new THREE.Group(); scene.add(mainGroup);
const layerConfigs = [
  { tex:glowTexCore, size:0.09, opacity:1.0 },
  { tex:glowTexMid,  size:0.18, opacity:0.75 },
  { tex:glowTexSoft, size:0.32, opacity:0.35 },
];

let particleLayers = [];
let basePosX, basePosY, basePosZ;     // school name text positions (open hand)
let baseHues;
let morphTargetX, morphTargetY, morphTargetZ; // blessing text positions (fist)
let particleCount = 0;

// Fireworks data

function allocFloat32(count, fill) {
  const a = new Float32Array(count);
  if (fill !== undefined) a.fill(fill);
  return a;
}

function createParticleLayer(texture, size, opacity) {
  const geo = new THREE.BufferGeometry();
  const mat = new THREE.PointsMaterial({
    map:texture, size, blending:THREE.AdditiveBlending,
    depthWrite:false, depthTest:true, transparent:true, opacity, vertexColors:true,
  });
  const points = new THREE.Points(geo, mat);
  points.frustumCulled = false;
  return points;
}

// ==========================================
//  TEXT-TO-PARTICLES: render text on canvas, sample pixels
// ==========================================
function sampleTextPixels(text, canvasW, canvasH, fontSize) {
  const canvas = document.createElement('canvas');
  canvas.width = canvasW; canvas.height = canvasH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 3;
  ctx.font = 'bold ' + fontSize + 'px "PingFang SC","Microsoft YaHei","SimHei",sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, canvasW/2, canvasH/2);
  ctx.strokeText(text, canvasW/2, canvasH/2);

  const imageData = ctx.getImageData(0, 0, canvasW, canvasH);
  const pixels = imageData.data;
  const points = [];
  for (let y = 0; y < canvasH; y++) {
    for (let x = 0; x < canvasW; x++) {
      if (pixels[(y * canvasW + x) * 4 + 3] > 65) {
        points.push({ x, y });
      }
    }
  }
  return points;
}

function fillParticlePositions(count, textPoints, canvasW, canvasH, scaleX, scaleY, arrX, arrY, arrZ, hueArr, textAllocPct) {
  const cx = canvasW / 2, cy = canvasH / 2;
  const textAlloc = Math.floor(count * textAllocPct);
  const tpLen = textPoints.length;

  for (let i = 0; i < textAlloc; i++) {
    if (tpLen > 0) {
      const idx = Math.floor((i / textAlloc) * tpLen) % tpLen;
      const pt = textPoints[idx];
      const jitter = 0.003 + Math.floor(i / tpLen) * 0.001;
      arrX[i] = (pt.x - cx) * scaleX + (Math.random() - 0.5) * jitter;
      arrY[i] = -(pt.y - cy) * scaleY + (Math.random() - 0.5) * jitter;
      arrZ[i] = (Math.random() - 0.5) * 0.12;
      if (hueArr) hueArr[i] = (pt.x / canvasW) * 0.5 + Math.random() * 0.08;
    }
  }

  // Tight glow for remaining particles
  for (let i = textAlloc; i < count; i++) {
    if (tpLen > 0) {
      const pt = textPoints[Math.floor(Math.random() * tpLen)];
      const glowSpread = 0.03 + Math.random() * 0.08;
      arrX[i] = (pt.x - cx) * scaleX + (Math.random() - 0.5) * glowSpread;
      arrY[i] = -(pt.y - cy) * scaleY + (Math.random() - 0.5) * glowSpread;
      arrZ[i] = (Math.random() - 0.5) * 0.25;
      if (hueArr) hueArr[i] = (pt.x / canvasW) * 0.45 + Math.random() * 0.1;
    } else {
      arrX[i] = (Math.random() - 0.5) * 4;
      arrY[i] = (Math.random() - 0.5) * 2;
      arrZ[i] = (Math.random() - 0.5) * 0.5;
      if (hueArr) hueArr[i] = Math.random();
    }
  }
}

function buildParticleSystem() {
  while (mainGroup.children.length > 0) mainGroup.remove(mainGroup.children[0]);
  particleLayers = [];

  const count = CONFIG.performanceMode ? Math.floor(CONFIG.particleDensity * 0.4) : CONFIG.particleDensity;
  particleCount = count;
  hasDrift = CONFIG.currentPreset !== 'fireworks' && CONFIG.currentPreset !== 'vortex';

  basePosX = allocFloat32(count);
  basePosY = allocFloat32(count);
  basePosZ = allocFloat32(count);
  baseHues = allocFloat32(count);
  morphTargetX = allocFloat32(count);
  morphTargetY = allocFloat32(count);
  morphTargetZ = allocFloat32(count);

  // Generate positions based on preset
  generatePresetPositions(CONFIG.currentPreset, count);

  // Fireworks
  if (CONFIG.currentPreset === 'fireworks') {
    fwPhase = allocFloat32(count); fwSpeed = allocFloat32(count);
    fwMaxRadius = allocFloat32(count);
    fwOriginX = allocFloat32(count); fwOriginY = allocFloat32(count); fwOriginZ = allocFloat32(count);
    for (let i = 0; i < count; i++) {
      fwPhase[i] = Math.random() * Math.PI * 2; fwSpeed[i] = 0.3 + Math.random() * 1.5;
      fwMaxRadius[i] = 0.5 + Math.random() * 1.0;
      fwOriginX[i] = (Math.random() - 0.5) * 0.3;
      fwOriginY[i] = (Math.random() - 0.5) * 0.3;
      fwOriginZ[i] = (Math.random() - 0.5) * 0.3;
    }
  }

  // Drift
  driftPhaseX = allocFloat32(count); driftPhaseY = allocFloat32(count); driftPhaseZ = allocFloat32(count);
  driftFreqX = allocFloat32(count); driftFreqY = allocFloat32(count); driftFreqZ = allocFloat32(count);
  driftAmp = allocFloat32(count); driftLerpSpeed = allocFloat32(count);
  for (let i = 0; i < count; i++) {
    driftPhaseX[i] = Math.random()*Math.PI*2; driftPhaseY[i] = Math.random()*Math.PI*2; driftPhaseZ[i] = Math.random()*Math.PI*2;
    driftFreqX[i] = 0.2+Math.random()*0.5; driftFreqY[i] = 0.2+Math.random()*0.5; driftFreqZ[i] = 0.2+Math.random()*0.5;
    driftAmp[i] = 0.015+Math.random()*0.06; driftLerpSpeed[i] = 0.6+Math.random()*2.5;
  }

  // Initialize gaoshuo morph targets
  if (CONFIG.currentPreset === 'gaoshuo') {
    generateGaoshuoTexts(count);
    scatterX = allocFloat32(count); scatterY = allocFloat32(count); scatterZ = allocFloat32(count);
    generateScatterPositions(count);
    fistPhase2 = false;
  } else {
    morphTargetX = morphTargetY = morphTargetZ = null;
    scatterX = scatterY = scatterZ = null;
  }

  // Build layers
  _tmpColor.set(CONFIG.baseColor); _tmpColor.getHSL(_tmpHSL);

  layerConfigs.forEach((cfg) => {
    const points = createParticleLayer(cfg.tex, cfg.size * CONFIG.particleSize, cfg.opacity);
    const geo = points.geometry;
    const posArray = new Float32Array(count * 3);
    const colArray = new Float32Array(count * 3);

    for (let i = 0; i < count; i++) {
      posArray[i*3] = basePosX[i]; posArray[i*3+1] = basePosY[i]; posArray[i*3+2] = basePosZ[i];
      const hue = (_tmpHSL.h + baseHues[i] * 0.3) % 1;
      _tmpColor.setHSL(hue, _tmpHSL.s, _tmpHSL.l);
      colArray[i*3] = _tmpColor.r; colArray[i*3+1] = _tmpColor.g; colArray[i*3+2] = _tmpColor.b;
    }

    geo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colArray, 3));
    mainGroup.add(points);
    particleLayers.push(points);
  });
}

function generatePresetPositions(preset, count) {
  switch (preset) {
    case 'dualsphere': generateDualSphere(count); break;
    case 'nebula':     generateNebula(count); break;
    case 'fireworks':  generateFireworks(count); break;
    case 'saturn':     generateSaturn(count); break;
    case 'flower':     generateFlower(count); break;
    case 'vortex':     generateVortex(count); break;
    case 'heart':      generateHeart(count); break;
    case 'gaoshuo':    generateGaoshuoBase(count); break;
    default:           generateNebula(count);
  }
}

function generateGaoshuoBase(count) {
  // basePos = blessing text (default display)
  const blessText = CONFIG.blessingText || '李明 高考加油!';
  let bw = 520, bh = 250, bfs = 130;
  if (blessText.length <= 4) { bw = 460; bfs = 150; }
  else if (blessText.length <= 6) { bw = 620; bfs = 125; }
  else { bw = 820; bfs = 100; }
  const pts = sampleTextPixels(blessText, bw, bh, bfs);
  fillParticlePositions(count, pts, bw, bh, 8.5/bw, 3.8/bh, basePosX, basePosY, basePosZ, baseHues, 0.94);
}


function generateFlowerPositions(count, arrX, arrY, arrZ) {
  const petals = 6;
  for (let i = 0; i < count; i++) {
    const t = Math.random() * Math.PI * 2;
    const r = Math.abs(Math.cos(petals * t * 0.5)) * 2.2;
    const spread = 0.1 + Math.random() * 0.15;
    const rr = r * (0.25 + Math.random() * 0.75) + (Math.random() - 0.5) * spread;
    arrX[i] = Math.cos(t) * rr;
    arrY[i] = Math.sin(t) * rr;
    arrZ[i] = (Math.random() - 0.5) * 0.25 * (1 + rr);
  }
}

function generateScatterPositions(count) {
  for (let i = 0; i < count; i++) {
    const phi = Math.acos(2 * Math.random() - 1);
    const theta = Math.random() * Math.PI * 2;
    const r = 1.5 + Math.pow(Math.random(), 0.5) * 5.5;
    scatterX[i] = Math.sin(phi) * Math.cos(theta) * r;
    scatterY[i] = Math.sin(phi) * Math.sin(theta) * r * 0.7;
    scatterZ[i] = Math.cos(phi) * r;
  }
}

    sprite.userData = { baseX: sprite.position.x, baseY: sprite.position.y, baseZ: sprite.position.z, phase: Math.random() * Math.PI * 2 };
    wordCloudGroup.add(sprite);
    wordSprites.push(sprite);

function generateNebula(count) {
  const arms=4,armSpread=0.35;
  for(let i=0;i<count;i++){
    const t=Math.random(),radius=Math.pow(t,0.6)*2.5;
    const armIndex=i%arms,baseAngle=(armIndex/arms)*Math.PI*2;
    const spiralAngle=radius*2.2,angle=baseAngle+spiralAngle+(Math.random()-0.5)*armSpread*(1+radius);
    const r=radius+(Math.random()-0.5)*0.3;
    basePosX[i]=Math.cos(angle)*r; basePosY[i]=(Math.random()-0.5)*0.4*(1-radius/3);
    basePosZ[i]=Math.sin(angle)*r+(Math.random()-0.5)*0.3;
    baseHues[i]=(radius/2.5)*0.8+Math.random()*0.2;
  }
}

function generateFireworks(count) {
  const bursts=5;
  for(let i=0;i<count;i++){
    const burstIndex=i%bursts,phi=Math.acos(2*Math.random()-1),theta=Math.random()*Math.PI*2;
    const radius=Math.pow(Math.random(),0.5)*2.0;
    basePosX[i]=(Math.random()-0.5)*0.4+Math.sin(phi)*Math.cos(theta)*radius;
    basePosY[i]=(Math.random()-0.5)*0.4+Math.sin(phi)*Math.sin(theta)*radius;
    basePosZ[i]=(Math.random()-0.5)*0.4+Math.cos(phi)*radius;
    baseHues[i]=(burstIndex/bursts+radius/2)%1;
  }
}

function generateSaturn(count) {
  const sphereRatio=0.3;
  for(let i=0;i<count;i++){
    if(i<count*sphereRatio){
      const phi=Math.acos(2*Math.random()-1),theta=Math.random()*Math.PI*2,r=0.6+Math.random()*0.1;
      basePosX[i]=Math.sin(phi)*Math.cos(theta)*r; basePosY[i]=Math.sin(phi)*Math.sin(theta)*r;
      basePosZ[i]=Math.cos(phi)*r; baseHues[i]=0.12+Math.random()*0.08;
    }else{
      const angle=Math.random()*Math.PI*2,ringRadius=1.3+Math.random()*0.8;
      const gap=Math.random()<0.15?(Math.random()*0.15):0;
      basePosX[i]=Math.cos(angle)*ringRadius; basePosZ[i]=Math.sin(angle)*ringRadius;
      basePosY[i]=gap+(Math.random()-0.5)*0.08; baseHues[i]=0.1+(ringRadius-1.3)*0.15;
    }
  }
}

function generateFlower(count) {
  const petals=6;
  for(let i=0;i<count;i++){
    const t=Math.random(),angle=t*Math.PI*2,r=Math.abs(Math.cos(petals*angle*0.5))*2.0;
    const spread=0.12+t*0.15,rr=r*(0.3+Math.random()*0.7)+(Math.random()-0.5)*spread;
    basePosX[i]=Math.cos(angle)*rr; basePosY[i]=Math.sin(angle)*rr;
    basePosZ[i]=(Math.random()-0.5)*0.25*(1+rr); baseHues[i]=(angle/(Math.PI*2)*0.7+rr*0.15)%1;
  }
}

function generateVortex(count) {
  for(let i=0;i<count;i++){
    const t=Math.random(),height=(t-0.5)*4,radius=(1-t)*1.8+0.1,angle=t*Math.PI*8+Math.random()*0.5;
    basePosX[i]=Math.cos(angle)*radius+(Math.random()-0.5)*0.15;
    basePosZ[i]=Math.sin(angle)*radius+(Math.random()-0.5)*0.15;
    basePosY[i]=height+(Math.random()-0.5)*0.2; baseHues[i]=(t*1.2)%1;
  }
}

function generateHeart(count) {
  for(let i=0;i<count;i++){
    const t=Math.random()*Math.PI*2,scale=1.6;
    const sx=16*Math.pow(Math.sin(t),3),sy=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
    const jitter=0.08;
    basePosX[i]=(sx/16)*scale+(Math.random()-0.5)*jitter;
    basePosY[i]=(sy/16)*scale+(Math.random()-0.5)*jitter;
    basePosZ[i]=(Math.random()-0.5)*0.3*(0.6+Math.abs(sx/16)*0.4);
    baseHues[i]=(Math.abs(basePosX[i])*0.25+Math.abs(basePosY[i])*0.15)%1;
  }
}

function generateDualSphere(count) {
  const outerRatio=0.65,outerCount=Math.floor(count*outerRatio),innerCount=count-outerCount;
  for(let i=0;i<outerCount;i++){
    const phi=Math.acos(2*Math.random()-1),theta=Math.random()*Math.PI*2,shellThickness=0.22;
    const r=1.6+(Math.random()-0.5)*shellThickness;
    basePosX[i]=Math.sin(phi)*Math.cos(theta)*r; basePosY[i]=Math.sin(phi)*Math.sin(theta)*r;
    basePosZ[i]=Math.cos(phi)*r; baseHues[i]=(phi/Math.PI)*0.6+Math.random()*0.1;
  }
  for(let i=outerCount;i<count;i++){
    const phi=Math.acos(2*Math.random()-1),theta=Math.random()*Math.PI*2;
    const r=0.65+(Math.random()-0.5)*0.12;
    basePosX[i]=Math.sin(phi)*Math.cos(theta)*r; basePosY[i]=Math.sin(phi)*Math.sin(theta)*r;
    basePosZ[i]=Math.cos(phi)*r; baseHues[i]=0.55+Math.random()*0.2;
  }
}

const RIPPLE_COUNT = 60;
let ripples = [];
function spawnRipple(position, colorHex) {
  const geo = new THREE.BufferGeometry();
  const posArr = new Float32Array(RIPPLE_COUNT * 3);
  const colArr = new Float32Array(RIPPLE_COUNT * 3);
  _tmpColor.set(colorHex || CONFIG.baseColor);
  for (let i = 0; i < RIPPLE_COUNT; i++) {
    posArr[i*3]=position.x; posArr[i*3+1]=position.y; posArr[i*3+2]=position.z;
    colArr[i*3]=_tmpColor.r; colArr[i*3+1]=_tmpColor.g; colArr[i*3+2]=_tmpColor.b;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
  const mat = new THREE.PointsMaterial({
    map:glowTexMid,size:0.08,blending:THREE.AdditiveBlending,
    depthWrite:false,depthTest:true,transparent:true,opacity:0.9,vertexColors:true,
  });
  const points = new THREE.Points(geo, mat); scene.add(points);
  const vx=allocFloat32(RIPPLE_COUNT),vy=allocFloat32(RIPPLE_COUNT),vz=allocFloat32(RIPPLE_COUNT),vs=allocFloat32(RIPPLE_COUNT);
  for(let i=0;i<RIPPLE_COUNT;i++){
    const dx=(Math.random()-0.5)*2,dy=(Math.random()-0.5)*2,dz=(Math.random()-0.5)*2;
    const len=Math.sqrt(dx*dx+dy*dy+dz*dz)||1;
    vx[i]=dx/len;vy[i]=dy/len;vz[i]=dz/len;vs[i]=0.4+Math.random()*1.2;
  }
  ripples.push({points,age:0,maxAge:1.2,originX:position.x,originY:position.y,originZ:position.z,vx,vy,vz,vs});
}
function updateRipples(dt) {
  for (let r = ripples.length-1; r >= 0; r--) {
    const ripple=ripples[r]; ripple.age+=dt;
    const progress=ripple.age/ripple.maxAge;
    if (progress>=1) {
      scene.remove(ripple.points); ripple.points.geometry.dispose(); ripple.points.material.dispose();
      ripples.splice(r,1); continue;
    }
    const posArr=ripple.points.geometry.attributes.position.array;
    for(let i=0;i<RIPPLE_COUNT;i++){
      const dist=progress*ripple.vs[i]*2;
      posArr[i*3]=ripple.originX+ripple.vx[i]*dist;
      posArr[i*3+1]=ripple.originY+ripple.vy[i]*dist;
      posArr[i*3+2]=ripple.originZ+ripple.vz[i]*dist;
    }
    ripple.points.geometry.attributes.position.needsUpdate=true;
    ripple.points.material.opacity=0.9*(1-progress);
  }
}

function getHandOpenness(landmarks) {
  if(!landmarks||landmarks.length<21)return 0.5;
  const palmX=(landmarks[0].x+landmarks[5].x+landmarks[17].x)/3;
  const palmY=(landmarks[0].y+landmarks[5].y+landmarks[17].y)/3;
  const palmZ=(landmarks[0].z+landmarks[5].z+landmarks[17].z)/3;
  const tips=[4,8,12,16,20]; let d=0;
  for(const t of tips){const dx=landmarks[t].x-palmX,dy=landmarks[t].y-palmY,dz=landmarks[t].z-palmZ;d+=Math.sqrt(dx*dx+dy*dy+dz*dz);}
  return Math.max(0,Math.min(1,(d/5-0.06)/0.28));
}

function onHandResults(results) {
  if(results.multiHandLandmarks&&results.multiHandLandmarks.length>0){
    const lm=results.multiHandLandmarks[0];
    const wasDetected=handState.detected; handState.detected=true;
    if(!wasDetected){
      const ds=0.25+CONFIG.spread*4.0;
      handState.fingertipScale.current=ds;handState.fingertipScale.target=ds;handState.fingertipScale.velocity=0;
    }
    handState.openness.target=getHandOpenness(lm);
    handState.position.x.target=(lm[0].x-0.5)*1.6; handState.position.y.target=-(lm[0].y-0.5)*1.2;
    updateGestureUI('已检测','on');
  }else{handState.detected=false;updateGestureUI('未检测','off');}
}

async function startHandTracking() {
  try{
    handsInstance=new Hands({locateFile:(f)=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/${f}`});
    handsInstance.setOptions({maxNumHands:1,modelComplexity:0,minDetectionConfidence:0.65,minTrackingConfidence:0.4});
    handsInstance.onResults(onHandResults);
    cameraInstance=new Camera(pipVideo,{onFrame:async()=>{if(mediaPipeSkipCounter>0){mediaPipeSkipCounter--;return;}mediaPipeSkipCounter=MEDIAPIPE_SKIP;if(mediaPipeProcessing||!handsInstance||pipVideo.readyState<2)return;mediaPipeProcessing=true;try{await handsInstance.send({image:pipVideo});}finally{mediaPipeProcessing=false;}},width:224,height:168});
    await cameraInstance.start();

// ==========================================
//  ANIMATION LOOP
// ==========================================
const clock=new THREE.Clock();
let globalRotationY=0,globalRotationX=0,hueShift=0,prevHandOpenness=handState.openness.current;
let fistStartTime=0, fistPhase2=false;
let rippleCooldown=0,frameSkip=0;

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.1),now=performance.now(),speed=CONFIG.rotationSpeed;
  frameSkip=(frameSkip+1)&1;

  handState.openness.current=smoothValue(handState.openness.current,handState.openness.target,SMOOTH_FACTOR);
  handState.position.x.current=smoothValue(handState.position.x.current,handState.position.x.target,SMOOTH_FACTOR);
  handState.position.y.current=smoothValue(handState.position.y.current,handState.position.y.target,SMOOTH_FACTOR);
  handState.pinch.current=smoothValue(handState.pinch.current,handState.pinch.target,SMOOTH_FACTOR*1.5);

  const opennessDelta=Math.abs(handState.openness.current-prevHandOpenness);
  rippleCooldown-=dt;
  if(opennessDelta>0.15&&rippleCooldown<=0&&handState.detected){spawnRipple(new THREE.Vector3(0,0,0),CONFIG.baseColor);rippleCooldown=0.4;}
  prevHandOpenness=handState.openness.current;

  if(handState.detected){
    const SPRING_ACCEL=10,SPRING_DAMPING=0.88;
    const target=handState.fingertipScale.target,current=handState.fingertipScale.current;
    const force=(target-current)*SPRING_ACCEL;
    handState.fingertipScale.velocity+=force*dt;handState.fingertipScale.velocity*=SPRING_DAMPING;
    handState.fingertipScale.current+=handState.fingertipScale.velocity*dt;
  }

  if(handState.detected){
    globalRotationY=smoothValue(globalRotationY,handState.position.x.target*Math.PI*0.8,SMOOTH_FACTOR);
    globalRotationX=smoothValue(globalRotationX,handState.position.y.target*Math.PI*0.6,SMOOTH_FACTOR);
  }else{globalRotationY+=speed*0.5*dt;globalRotationX=Math.sin(now*0.0003)*0.3;}

  const currentScale=handState.detected?handState.fingertipScale.current:0.25+CONFIG.spread*4.0;
  mainGroup.scale.set(1,1,1);mainGroup.rotation.y=globalRotationY;mainGroup.rotation.x=globalRotationX;
  hueShift=(globalRotationY+globalRotationX)*0.4;

  // Color update
  if(!frameSkip){
    _tmpColor.set(CONFIG.baseColor);_tmpColor.getHSL(_tmpHSL);
    for(let li=0;li<particleLayers.length;li++){
      const colArr=particleLayers[li].geometry.attributes.color;if(!colArr)continue;
      const arr=colArr.array;const n=Math.min(particleCount,arr.length/3);
      if(CONFIG.fixedColor){
        const r=_tmpColor.r,g=_tmpColor.g,b=_tmpColor.b;
        for(let i=0;i<n;i++){const i3=i*3;arr[i3]=r;arr[i3+1]=g;arr[i3+2]=b;}
      }else{
        const hb=_tmpHSL.h,s=_tmpHSL.s,l=_tmpHSL.l;
        for(let i=0;i<n;i++){const h=(hb+baseHues[i]*0.3+hueShift)%1;_tmpColor.setHSL(h,s,l);const i3=i*3;arr[i3]=_tmpColor.r;arr[i3+1]=_tmpColor.g;arr[i3+2]=_tmpColor.b;}
      }
      colArr.needsUpdate=true;
    }
  }

  // Auto cycle update
  autoCycle.timer += dt * 1000;
  if(autoCycle.timer >= autoCycle.durations[autoCycle.phase]){
    autoCycle.timer = 0;
    autoCycle.phase = (autoCycle.phase + 1) % 3;
  }

  // Particle drift + gaoshuo morph (auto-cycle)
  if(hasDrift&&particleCount>0){
    const driftTime=now*0.001,driftAmpGlobal=0.04;
    const isGaoshuo=CONFIG.currentPreset==='gaoshuo'&&morphTargetX;
    // Auto cycle: phase0=blessing(morph=1), phase1&2=flower(morph=0)
    const morphFactor=(isGaoshuo)?(autoCycle.phase===0?1.0:0.0):1.0;

    for(let li=0;li<particleLayers.length;li++){
      const posArr=particleLayers[li].geometry.attributes.position;if(!posArr)continue;
      const arr=posArr.array;const n=Math.min(particleCount,arr.length/3);
      for(let i=0;i<n;i++){
        let srcX=basePosX[i],srcY=basePosY[i],srcZ=basePosZ[i];
        if(isGaoshuo){
          srcX=morphTargetX[i]+(basePosX[i]-morphTargetX[i])*morphFactor;
          srcY=morphTargetY[i]+(basePosY[i]-morphTargetY[i])*morphFactor;
          srcZ=morphTargetZ[i]+(basePosZ[i]-morphTargetZ[i])*morphFactor;
        }
        const tx=srcX*currentScale+Math.sin(driftTime*driftFreqX[i]+driftPhaseX[i])*driftAmp[i]*driftAmpGlobal;
        const ty=srcY*currentScale+Math.cos(driftTime*driftFreqY[i]+driftPhaseY[i])*driftAmp[i]*driftAmpGlobal;
        const tz=srcZ*currentScale+Math.sin(driftTime*driftFreqZ[i]+driftPhaseZ[i])*driftAmp[i]*driftAmpGlobal;
        const morphSpeed=isGaoshuo?4.0:1.0;
        const spd=driftLerpSpeed[i]*dt*morphSpeed;const i3=i*3;
        arr[i3]+=(tx-arr[i3])*spd;arr[i3+1]+=(ty-arr[i3+1])*spd;arr[i3+2]+=(tz-arr[i3+2])*spd;
      }
      posArr.needsUpdate=true;
    }
  }

  // Fireworks
  if(CONFIG.currentPreset==='fireworks'&&fwPhase){
    const t=now*0.001,n=Math.min(particleCount,fwPhase.length);
    const posArrs=[];for(let li=0;li<particleLayers.length;li++)posArrs.push(particleLayers[li].geometry.attributes.position.array);
    for(let i=0;i<n;i++){
      const cycle=(t*fwSpeed[i]+fwPhase[i])%(Math.PI*2),radius=Math.sin(cycle)*fwMaxRadius[i];
      const bx=basePosX[i],by=basePosY[i],bz=basePosZ[i],len=Math.sqrt(bx*bx+by*by+bz*bz)||0.001;
      _fwDir.set(bx/len,by/len,bz/len);
      const nx=fwOriginX[i]+_fwDir.x*radius,ny=fwOriginY[i]+_fwDir.y*radius,nz=fwOriginZ[i]+_fwDir.z*radius,i3=i*3;
      for(let pi=0;pi<posArrs.length;pi++){const a=posArrs[pi];a[i3]=nx;a[i3+1]=ny;a[i3+2]=nz;}
    }
    for(let li=0;li<particleLayers.length;li++)particleLayers[li].geometry.attributes.position.needsUpdate=true;
  }

  // Vortex
  if(CONFIG.currentPreset==='vortex'&&particleCount>0){
    const swirlTime=now*0.0005;
    const posArrs=[];for(let li=0;li<particleLayers.length;li++)posArrs.push(particleLayers[li].geometry.attributes.position.array);
    for(let i=0;i<particleCount;i++){
      const by=basePosY[i],swirlAngle=swirlTime*(1+by*0.5);
      const cosA=Math.cos(swirlAngle),sinA=Math.sin(swirlAngle);
      const nx=basePosX[i]*cosA-basePosZ[i]*sinA,nz=basePosX[i]*sinA+basePosZ[i]*cosA,i3=i*3;
      for(let pi=0;pi<posArrs.length;pi++){const a=posArrs[pi];a[i3]=nx;a[i3+1]=by;a[i3+2]=nz;}
    }
    for(let li=0;li<particleLayers.length;li++)particleLayers[li].geometry.attributes.position.needsUpdate=true;
  }

  // Auto-cycle phase management: phase1=flower bloom, phase2=scatter+wordcloud
  if(CONFIG.currentPreset==='gaoshuo'&&morphTargetX&&particleCount>0){
    const isPhase2=autoCycle.phase===2;
    fistPhase2=isPhase2;

    const posArrs=[];for(let li=0;li<particleLayers.length;li++)posArrs.push(particleLayers[li].geometry.attributes.position.array);
    if(isPhase2&&scatterX){
      for(let i=0;i<particleCount;i++){
        const i3=i*3;
        for(let pi=0;pi<posArrs.length;pi++){const a=posArrs[pi];a[i3]=scatterX[i];a[i3+1]=scatterY[i];a[i3+2]=scatterZ[i];}
      }
    }else if(autoCycle.phase===1){
      const bloomTime=now*0.001;
      for(let i=0;i<particleCount;i++){
        const bx=morphTargetX[i],by=morphTargetY[i],bz=morphTargetZ[i];
        const rotAngle=bloomTime*1.2;
        const cosA=Math.cos(rotAngle),sinA=Math.sin(rotAngle);
        const nx=bx*cosA-bz*sinA,nz=bx*sinA+bz*cosA;
        const pulse=1.0+Math.sin(bloomTime*2.5+i*0.1)*0.15;
        const i3=i*3;
        for(let pi=0;pi<posArrs.length;pi++){const a=posArrs[pi];a[i3]=nx*pulse;a[i3+1]=by*pulse;a[i3+2]=nz*pulse;}
      }
    }
    for(let li=0;li<particleLayers.length;li++)particleLayers[li].geometry.attributes.position.needsUpdate=true;
  }

  // 985 word cloud visibility (auto-cycle phase 2)
  if(wordSprites.length>0){
    const targetOpacity=(autoCycle.phase===2)?0.85:0;
    const wcTime=now*0.001;
    for(let i=0;i<wordSprites.length;i++){
      const s=wordSprites[i];
      s.material.opacity+=(targetOpacity-s.material.opacity)*2.5*dt;
      if(targetOpacity>0){
        const ud=s.userData;
        s.position.x+=(ud.baseX+Math.sin(wcTime*0.3+ud.phase)*0.3-s.position.x)*0.5*dt;
        s.position.y+=(ud.baseY+Math.cos(wcTime*0.35+ud.phase)*0.25-s.position.y)*0.5*dt;
        s.position.z+=(ud.baseZ+Math.sin(wcTime*0.28+ud.phase+1)*0.25-s.position.z)*0.5*dt;
      }
    }
    if(wordCloudGroup)wordCloudGroup.rotation.y+=dt*0.06;
  }

  // Music volume control
  const bgmMain=document.getElementById('bgm-audio');
  const bgmBg=document.getElementById('bgm-bg');
  if(bgmMain){
    const volMain=parseFloat(document.getElementById('vol-main-slider').value);
    const volBg=parseFloat(document.getElementById('vol-bg-slider').value);
    bgmMain.volume=volMain;
    if(bgmBg)bgmBg.volume=volBg;
  }

  updateRipples(dt);
  if(bgStars){bgStars.rotation.y+=dt*0.03;bgStars.rotation.x+=dt*0.01;}
  updateFPS(now);
  renderer.render(scene,camera);
}

const presetShortcuts={'0':'dualsphere','1':'nebula','2':'fireworks','3':'saturn','4':'flower','5':'vortex','6':'heart','7':'gaoshuo'};
window.addEventListener('keydown',e=>{
  switch(e.key.toLowerCase()){
    case'f':document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();break;
    case'r':document.getElementById('reset-btn').click();break;
    case'h':sbt.click();break;
    case'p':document.getElementById('perf-toggle').click();break;
    default:if(presetShortcuts[e.key])document.querySelector('[data-preset="'+presetShortcuts[e.key]+'"]').click();
  }
});
